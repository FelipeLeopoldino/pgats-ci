name: "Execução Manual"

on:
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - uses: actions/checkout@v4

      # Node
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # Yarn
      - name: Instalando Yarn
        run: npm install -g yarn

      # Dependências
      - name: Instalando dependências
        run: yarn

      # Browsers Playwright
      - name: Instalando Browsers do Playwright
        run: yarn playwright install --with-deps

      # Testes
      - name: Executando testes E2E
        run: yarn run e2e

      # Summary da execução
      - name: Publicar resumo
        if: always()
        run: |
          echo "# Resultado da Execução E2E" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Framework: Playwright" >> $GITHUB_STEP_SUMMARY
          echo "- Pipeline: GitHub Actions" >> $GITHUB_STEP_SUMMARY
          echo "- Data: $(date)" >> $GITHUB_STEP_SUMMARY

      # Relatório Playwright
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      # Evidências
      - name: Upload Evidências
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias
          path: test-results/

      # Allure Results
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/