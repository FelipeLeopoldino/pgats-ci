name: "Execução Manual"

on:
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout do projeto
        uses: actions/checkout@v4

      # Node
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # Yarn
      - name: Instalar Yarn
        run: npm install -g yarn

      # Dependências
      - name: Instalar dependências
        run: yarn

      # Browsers Playwright
      - name: Instalar Browsers do Playwright
        run: yarn playwright install --with-deps

      # Executar testes
      - name: Executar testes E2E
        run: yarn run e2e

      # Verificar arquivos gerados (ajuda no debug)
      - name: Listar relatórios gerados
        if: always()
        run: |
          echo "=== Diretórios ==="
          find . -type d | grep -E "playwright-report|allure-results|allure-report|test-results" || true

      # Summary visível na execução
      - name: Publicar resumo
        if: always()
        run: |
          echo "# Resultado da Execução E2E" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Framework: Playwright" >> $GITHUB_STEP_SUMMARY
          echo "- Pipeline: GitHub Actions" >> $GITHUB_STEP_SUMMARY
          echo "- Relatórios gerados como artefatos" >> $GITHUB_STEP_SUMMARY

      # Artifact - Playwright HTML Report
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn

      # Artifact - Evidências
      - name: Upload Evidências
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias
          path: test-results/
          if-no-files-found: warn

      # Artifact - Allure Results
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn

      # Comentário/Sumário Playwright
      - name: Playwright Report Summary
        if: always()
        uses: daun/playwright-report-summary@v4.0.0
        with:
          report-file: playwright-report/results.json